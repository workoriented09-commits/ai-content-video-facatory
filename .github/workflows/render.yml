name: AI Content Factory

on:
  workflow_dispatch:

jobs:
  create-scene-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              result = response.read().decode("utf-8")

          data = json.loads(result)

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          content = data["content"]

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  content,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", content.get("TOPIC"))
          print("Score:", content.get("SCORE"))

          for i in range(1, 6):
              print(
                  f"SCENE_{i}:",
                  content.get(f"SCENE_{i}", "")[:100]
              )
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("content/scenes", exist_ok=True)

          for i in range(1, 6):
              scene = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not scene:
                  scene = f"Scene {i}"

              with open(
                  f"content/scenes/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(scene)

              print(f"Created scene {i}")

          PY

      - name: Create five scene videos
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do
            echo "Creating scene $i..."

            ffmpeg \
              -y \
              -f lavfi \
              -i "color=c=black:s=1080x1920:r=30" \
              -vf "drawtext=text='SCENE $i':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=250,drawtext=textfile=content/scenes/scene_${i}.txt:fontcolor=white:fontsize=42:line_spacing=18:x=(w-text_w)/2:y=650" \
              -t 3 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              "output/scenes/scene_${i}.mp4"

          done

      - name: Join scenes
        run: |
          printf "file '%s'\n" \
            output/scenes/scene_1.mp4 \
            output/scenes/scene_2.mp4 \
            output/scenes/scene_3.mp4 \
            output/scenes/scene_4.mp4 \
            output/scenes/scene_5.mp4 \
            > output/concat.txt

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i output/concat.txt \
            -c copy \
            output/ai_video_scenes.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-scenes
          path: output/ai_video_scenes.mp4
