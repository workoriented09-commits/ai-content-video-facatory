name: AI Content Factory

on:
  workflow_dispatch:

jobs:

  test-sheet-connection:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read READY content from Google Sheet
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Connecting to Google Sheet...")

          with urllib.request.urlopen(request) as response:

              result = response.read().decode("utf-8")
              data = json.loads(result)
                 print("Response received from Google Apps Script:")
                 print(data)

if not data.get("success"):
    print("Received secret length:", data.get("receivedLength"))
    print("Stored secret length:", data.get("storedLength"))

    raise Exception(
        data.get("error", "Unknown error")
    )

          content = data["content"]

          print("")
          print("================================")
          print("GOOGLE SHEET CONNECTION SUCCESS")
          print("================================")
          print("")
          print("Sheet row:", content.get("sheetRow"))
          print("Status:", content.get("STATUS"))
          print("Topic:", content.get("TOPIC"))
          print("Category:", content.get("CATEGORY"))
          print("Score:", content.get("SCORE"))
          print("")
          print("READY content successfully received.")
          print("================================")
          PY
