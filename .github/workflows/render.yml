name: AI Content Factory

on:
  workflow_dispatch:

jobs:
  prepare-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get READY content from Google Sheet
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Connecting to Google Sheet...")

          with urllib.request.urlopen(request) as response:
              result = response.read().decode("utf-8")

          data = json.loads(result)

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          content = data["content"]

          print("READY content received.")
          print("Row:", content.get("sheetRow"))
          print("Status:", content.get("STATUS"))
          print("Topic:", content.get("TOPIC"))
          print("Score:", content.get("SCORE"))

          os.makedirs("content", exist_ok=True)

          with open("content/ready_content.json", "w", encoding="utf-8") as file:
              json.dump(
                  content,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Content saved to content/ready_content.json")
          PY

      - name: Show extracted content
        run: |
          echo "========== READY CONTENT =========="
          cat content/ready_content.json
          echo "==================================="

      - name: Upload content
        uses: actions/upload-artifact@v4
        with:
          name: ready-content
          path: content/ready_content.json
