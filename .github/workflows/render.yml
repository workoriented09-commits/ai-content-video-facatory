name: AI Content Factory

on:
  workflow_dispatch:

jobs:
  create-scene-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              result = response.read().decode("utf-8")

          data = json.loads(result)

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          content = data["content"]

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  content,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", content.get("TOPIC"))
          print("Score:", content.get("SCORE"))

          for i in range(1, 6):
              print(
                  f"SCENE_{i}:",
                  content.get(f"SCENE_{i}", "")[:100]
              )
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("content/scenes", exist_ok=True)

          for i in range(1, 6):
              scene = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not scene:
                  scene = f"Scene {i}"

              with open(
                  f"content/scenes/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(scene)

              print(f"Created scene {i}")
          PY

      - name: Create animated scene videos
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do
            echo "Creating animated scene $i..."

            case $i in
              1)
                START_X=100
                START_Y=200
                END_X=900
                END_Y=1600
                ;;
              2)
                START_X=900
                START_Y=1600
                END_X=100
                END_Y=300
                ;;
              3)
                START_X=500
                START_Y=100
                END_X=500
                END_Y=1700
                ;;
              4)
                START_X=100
                START_Y=1500
                END_X=900
                END_Y=300
                ;;
              5)
                START_X=900
                START_Y=300
                END_X=100
                END_Y=1500
                ;;
            esac

            ffmpeg \
              -y \
              -f lavfi \
              -i "nullsrc=s=1080x1920:r=30" \
              -vf "\
              geq=\
              r='35+35*sin((X+$START_X*2)/180+(T*0.8))+20*sin((Y+$START_Y)/240)',\
              g='10+20*sin((Y+$START_Y)/210+(T*0.6))+15*sin((X+$START_X)/300)',\
              b='55+45*sin((X+$START_X)/230+(Y+$START_Y)/260+T*0.5)',\
              drawtext=text='SCENE $i':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=230,\
              drawtext=textfile=content/scenes/scene_${i}.txt:fontcolor=white:fontsize=42:line_spacing=18:x=(w-text_w)/2:y=650" \
              -t 3 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -r 30 \
              "output/scenes/scene_${i}.mp4"

          done

      - name: Join scenes
        run: |
          ffmpeg \
            -y \
            -i output/scenes/scene_1.mp4 \
            -i output/scenes/scene_2.mp4 \
            -i output/scenes/scene_3.mp4 \
            -i output/scenes/scene_4.mp4 \
            -i output/scenes/scene_5.mp4 \
            -filter_complex "[0:v][1:v][2:v][3:v][4:v]concat=n=5:v=1:a=0[outv]" \
            -map "[outv]" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -r 30 \
            output/ai_video_scenes.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-scenes
          path: output/ai_video_scenes.mp4
