name: AI Content Factory

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              result = response.read().decode("utf-8")

          data = json.loads(result)

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          content = data["content"]

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  content,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", content.get("TOPIC"))
          print("Score:", content.get("SCORE"))
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create video
        run: |
          mkdir -p output

          ffmpeg \
            -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -t 10 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            output/ai_video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ai-video
          path: output/ai_video.mp4
