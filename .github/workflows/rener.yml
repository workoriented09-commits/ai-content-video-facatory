name: AI Video Renderer

on:
  workflow_dispatch:

jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show FFmpeg version
        run: |
          ffmpeg -version

      - name: Render test video
        run: |
          python3 render.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/test_video.mp4
