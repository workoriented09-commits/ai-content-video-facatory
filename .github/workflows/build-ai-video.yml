name: Build AI Video

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT REPOSITORY
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # GET READY CONTENT
      # ==================================================

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data["content"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", data["content"].get("TOPIC"))
          print("Score:", data["content"].get("SCORE"))
          PY


      # ==================================================
      # INSTALL PYTHON TOOLS
      # ==================================================

      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          pip install huggingface_hub pillow


      # ==================================================
      # IMAGE GENERATION WITH FALLBACK
      # ==================================================

      - name: Generate new images with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import shutil
          from pathlib import Path

          from PIL import Image
          from huggingface_hub import InferenceClient

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("images", exist_ok=True)

          style = """
          Photorealistic cinematic photograph,
          captured with a professional digital cinema camera,
          realistic natural lighting,
          realistic textures and materials,
          realistic depth of field,
          realistic lens characteristics,
          subtle cinematic film grain,
          highly detailed real-world photography,
          vertical 9:16 composition.

          No illustration,
          no cartoon,
          no anime,
          no 3D render,
          no text,
          no captions,
          no logos,
          no watermark.
          """

          client = None

          if os.environ.get("HF_TOKEN"):

              try:

                  client = InferenceClient(
                      api_key=os.environ["HF_TOKEN"]
                  )

                  print(
                      "Hugging Face image generation available."
                  )

              except Exception as e:

                  print(
                      "Could not initialize Hugging Face."
                  )

                  print("Reason:", str(e))

          else:

              print("HF_TOKEN not available.")
              print("Existing images will be used.")

          for i in range(1, 6):

              final_file = Path(
                  f"images/scene_{i}.png"
              )

              old_file = Path(
                  f"scene_{i}.png"
              )

              temp_file = Path(
                  f"images/scene_{i}_new.png"
              )

              # ------------------------------------------
              # EXISTING IMAGE
              # ------------------------------------------

              if old_file.exists():

                  try:

                      with Image.open(old_file) as check:
                          check.verify()

                      shutil.copy2(
                          old_file,
                          final_file
                      )

                      print(
                          f"Existing image found for scene {i}."
                      )

                  except Exception as e:

                      print(
                          f"Existing image for scene {i} "
                          f"is invalid."
                      )

                      print("Reason:", str(e))


              # ------------------------------------------
              # TRY NEW IMAGE
              # ------------------------------------------

              if client is not None:

                  scene = str(
                      content.get(
                          f"SCENE_{i}",
                          ""
                      )
                  ).strip()

                  if not scene:

                      scene = (
                          f"Cinematic realistic environment "
                          f"for scene {i}"
                      )

                  prompt = f"""
                  {style}

                  Visually represent this scene:

                  {scene}
                  """

                  try:

                      print(
                          f"Trying NEW image for scene {i}..."
                      )

                      image = client.text_to_image(
                          prompt=prompt,
                          model=(
                              "black-forest-labs/"
                              "FLUX.1-schnell"
                          )
                      )

                      image.save(temp_file)

                      with Image.open(temp_file) as check:
                          check.verify()

                      shutil.move(
                          temp_file,
                          final_file
                      )

                      print(
                          f"NEW image created for scene {i}."
                      )

                      time.sleep(2)

                  except Exception as e:

                      print(
                          f"NEW image generation failed "
                          f"for scene {i}."
                      )

                      print("Reason:", str(e))
                      print("Using existing image.")

                      if temp_file.exists():
                          temp_file.unlink()


              # ------------------------------------------
              # FINAL CHECK
              # ------------------------------------------

              if not final_file.exists():

                  raise Exception(
                      f"No usable image exists for scene {i}."
                  )

              print(
                  f"Scene {i} image ready."
              )

          print("All five images are ready.")
          PY


      # ==================================================
      # INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==================================================
      # CREATE CAPTIONS
      # ==================================================

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs(
              "scene_text",
              exist_ok=True
          )

          for i in range(1, 6):

              text = str(
                  content.get(
                      f"SCENE_{i}",
                      ""
                  )
              ).strip()

              if not text:
                  text = f"Scene {i}"

              lines = []

              for paragraph in text.splitlines():

                  wrapped = textwrap.wrap(
                      paragraph,
                      width=30,
                      break_long_words=False,
                      break_on_hyphens=False
                  )

                  if wrapped:
                      lines.extend(wrapped)
                  else:
                      lines.append("")

              with open(
                  f"scene_text/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "\n".join(lines)
                  )

              print(
                  f"Caption prepared for scene {i}."
              )

          print("All caption files created.")
          PY


      # ==================================================
      # CREATE FIVE VIDEO SCENES
      #
      # 8.25 SECONDS EACH
      # ==================================================

      - name: Create video scenes
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do

            echo "Building scene $i..."

            ffmpeg \
              -y \
              -loop 1 \
              -i "images/scene_${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=248:s=1080x1920:fps=30,drawtext=textfile=scene_text/scene_${i}.txt:fontcolor=white:fontsize=34:borderw=3:bordercolor=black:line_spacing=12:x=(w-text_w)/2:y=h-text_h-180" \
              -frames:v 248 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r 30 \
              -movflags +faststart \
              "output/scenes/scene_${i}.mp4"

          done

          echo "Five 8.25-second scenes created."


      # ==================================================
      # JOIN SCENES WITH SMOOTH CROSSFADE
      #
      # FINAL ≈ 40 SECONDS
      # ==================================================

      - name: Join scenes with transitions
        run: |
          ffmpeg \
            -y \
            -i output/scenes/scene_1.mp4 \
            -i output/scenes/scene_2.mp4 \
            -i output/scenes/scene_3.mp4 \
            -i output/scenes/scene_4.mp4 \
            -i output/scenes/scene_5.mp4 \
            -filter_complex "\
          [0:v]setpts=PTS-STARTPTS[v0];\
          [1:v]setpts=PTS-STARTPTS[v1];\
          [2:v]setpts=PTS-STARTPTS[v2];\
          [3:v]setpts=PTS-STARTPTS[v3];\
          [4:v]setpts=PTS-STARTPTS[v4];\
          [v0][v1]xfade=transition=fade:duration=0.3:offset=7.95[v01];\
          [v01][v2]xfade=transition=fade:duration=0.3:offset=15.90[v012];\
          [v012][v3]xfade=transition=fade:duration=0.3:offset=23.85[v0123];\
          [v0123][v4]xfade=transition=fade:duration=0.3:offset=31.80[outv]" \
            -map "[outv]" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -movflags +faststart \
            output/video_without_voice.mp4

          echo "Scene transitions completed."


      # ==================================================
      # GENERATE VOICE
      # ==================================================

      - name: Generate voice with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python3 - <<'PY'
          import os
          import json
          import subprocess
          from pathlib import Path

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          script = str(
              content.get(
                  "SCRIPT",
                  ""
              )
          ).strip()

          if not script:

              scenes = []

              for i in range(1, 6):

                  text = str(
                      content.get(
                          f"SCENE_{i}",
                          ""
                      )
                  ).strip()

                  if text:
                      scenes.append(text)

              script = " ".join(scenes)

          if not script:

              raise Exception(
                  "No SCRIPT or scene text found."
              )

          voice_created = False

          # ------------------------------------------
          # TRY AI VOICE
          # ------------------------------------------

          if os.environ.get("HF_TOKEN"):

              try:

                  from huggingface_hub import (
                      InferenceClient
                  )

                  print("Trying AI voice...")

                  client = InferenceClient(
                      api_key=os.environ["HF_TOKEN"]
                  )

                  audio = client.text_to_speech(
                      text=script,
                      model="hexgrad/Kokoro-82M"
                  )

                  Path(
                      "output/narration.flac"
                  ).write_bytes(
                      audio
                  )

                  print("AI voice created.")

                  voice_created = True

              except Exception as e:

                  print(
                      "AI voice unavailable."
                  )

                  print(
                      "Reason:",
                      str(e)
                  )


          # ------------------------------------------
          # FREE LOCAL VOICE
          # ------------------------------------------

          if not voice_created:

              print(
                  "Using free local voice."
              )

              subprocess.run(
                  [
                      "sudo",
                      "apt-get",
                      "update",
                      "-qq"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "sudo",
                      "apt-get",
                      "install",
                      "-y",
                      "espeak-ng"
                  ],
                  check=True
              )

              Path(
                  "output/narration.txt"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "espeak-ng",
                      "-v",
                      "en-us",
                      "-s",
                      "145",
                      "-p",
                      "45",
                      "-a",
                      "150",
                      "-f",
                      "output/narration.txt",
                      "-w",
                      "output/narration.wav"
                  ],
                  check=True
              )

              print(
                  "Free local voice created."
              )


      # ==================================================
      # CREATE 40-SECOND ORIGINAL MUSIC
      # ==================================================

      - name: Create background music
        run: |
          python3 - <<'PY'
          import math
          import wave
          import struct

          sample_rate = 44100
          duration = 40

          chords = [
              [110.00, 164.81, 220.00],
              [98.00, 146.83, 196.00],
              [130.81, 196.00, 261.63],
              [87.31, 130.81, 174.61],
              [110.00, 164.81, 220.00]
          ]

          samples = int(
              sample_rate * duration
          )

          with wave.open(
              "output/background_music.wav",
              "w"
          ) as wav:

              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)

              for n in range(samples):

                  t = n / sample_rate

                  section = min(
                      int(t / 8),
                      4
                  )

                  chord = chords[section]

                  value = 0.0

                  for index, freq in enumerate(chord):

                      value += (
                          math.sin(
                              2
                              * math.pi
                              * freq
                              * t
                          )
                          * (
                              0.16
                              - index * 0.025
                          )
                      )

                  movement = (
                      0.65
                      + 0.35
                      * math.sin(
                          2
                          * math.pi
                          * 0.08
                          * t
                      )
                  )

                  fade_in = min(
                      t / 2.0,
                      1.0
                  )

                  fade_out = min(
                      (duration - t) / 2.0,
                      1.0
                  )

                  envelope = max(
                      0.0,
                      min(
                          fade_in,
                          fade_out
                      )
                  )

                  value *= (
                      movement
                      * envelope
                      * 0.35
                  )

                  value = max(
                      -1.0,
                      min(
                          1.0,
                          value
                      )
                  )

                  sample = int(
                      value * 32767
                  )

                  wav.writeframes(
                      struct.pack(
                          "<hh",
                          sample,
                          sample
                      )
                  )

          print(
              "40-second background music created."
          )
          PY


      # ==================================================
      # MIX VOICE + MUSIC
      # ==================================================

      - name: Mix voice and background music
        run: |

          if [ -f output/narration.flac ]; then

            echo "Using AI narration."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.flac \
              -i output/background_music.wav \
              -filter_complex "\
          [1:a]apad,volume=1.0[voice];\
          [2:a]volume=0.12[music];\
          [voice][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 40 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              output/final_ai_video.mp4


          elif [ -f output/narration.wav ]; then

            echo "Using local narration."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.wav \
              -i output/background_music.wav \
              -filter_complex "\
          [1:a]apad,volume=1.0[voice];\
          [2:a]volume=0.12[music];\
          [voice][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 40 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              output/final_ai_video.mp4


          else

            echo "No narration file found."

            exit 1

          fi

          echo "Final 40-second video created."


      # ==================================================
      # CREATE THUMBNAIL
      # ==================================================

      - name: Create thumbnail
        run: |

          echo "Creating YouTube thumbnail..."

          ffmpeg \
            -y \
            -i images/scene_1.png \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -frames:v 1 \
            -q:v 2 \
            output/thumbnail.jpg

          echo "Thumbnail created."


      # ==================================================
      # CREATE UPLOAD INFORMATION
      # ==================================================

      - name: Create upload information
        run: |
          python3 - <<'PY'
          import json
          import re

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          topic = str(
              content.get(
                  "TOPIC",
                  "AI Short"
              )
          ).strip()

          title = str(
              content.get(
                  "TITLE",
                  ""
              )
          ).strip()

          description = str(
              content.get(
                  "DESCRIPTION",
                  ""
              )
          ).strip()

          hashtags = str(
              content.get(
                  "HASHTAGS",
                  ""
              )
          ).strip()

          # ------------------------------------------
          # TITLE FALLBACK
          # ------------------------------------------

          if not title:
              title = topic

          title = re.sub(
              r"\s+",
              " ",
              title
          ).strip()

          if len(title) > 95:
              title = (
                  title[:92].rstrip()
                  + "..."
              )


          # ------------------------------------------
          # DESCRIPTION FALLBACK
          # ------------------------------------------

          if not description:

              description = (
                  f"{topic}\n\n"
                  "Watch till the end and "
                  "share your thoughts.\n\n"
                  "#Shorts"
              )


          # ------------------------------------------
          # HASHTAGS FALLBACK
          # ------------------------------------------

          if not hashtags:

              words = re.findall(
                  r"[A-Za-z0-9]+",
                  topic
              )

              clean_words = []

              for word in words:

                  if len(word) >= 3:
                      clean_words.append(
                          word.lower()
                      )

              tags = ["#Shorts"]

              for word in clean_words[:4]:

                  tag = "#" + word

                  if tag not in tags:
                      tags.append(tag)

              hashtags = " ".join(tags)


          # ------------------------------------------
          # ADD HASHTAGS
          # ------------------------------------------

          if "#Shorts" not in description:

              description = (
                  description.rstrip()
                  + "\n\n"
                  + hashtags
              )


          # ------------------------------------------
          # SAVE UPLOAD INFORMATION
          # ------------------------------------------

          with open(
              "output/upload_info.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "YOUTUBE SHORT UPLOAD INFORMATION\n"
              )

              f.write(
                  "================================\n\n"
              )

              f.write(
                  "TITLE:\n"
              )

              f.write(
                  title
                  + "\n\n"
              )

              f.write(
                  "DESCRIPTION:\n"
              )

              f.write(
                  description
                  + "\n\n"
              )

              f.write(
                  "HASHTAGS:\n"
              )

              f.write(
                  hashtags
                  + "\n\n"
              )

              f.write(
                  "VIDEO:\n"
              )

              f.write(
                  "final_ai_video.mp4\n\n"
              )

              f.write(
                  "THUMBNAIL:\n"
              )

              f.write(
                  "thumbnail.jpg\n"
              )


          print("Upload information created.")

          print("")
          print("TITLE:")
          print(title)

          print("")
          print("HASHTAGS:")
          print(hashtags)
          PY


      # ==================================================
      # CREATE PACKAGE README
      # ==================================================

      - name: Create package manifest
        run: |
          cat > output/README.txt <<'EOF'
          AI VIDEO PACKAGE
          =================

          final_ai_video.mp4
          The finished approximately 40-second video.

          thumbnail.jpg
          Thumbnail image for the video.

          upload_info.txt
          Suggested YouTube title, description and hashtags.

          The video contains:
          - Five cinematic scenes
          - Animated camera movement
          - Captions
          - Voice narration
          - Background music
          - Smooth scene transitions

          Generated by the AI Content Factory workflow.
          EOF

          echo "Package manifest created."


      # ==================================================
      # UPLOAD EVERYTHING
      # ==================================================

      - name: Upload final YouTube package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-package-40s
          path: |
            output/final_ai_video.mp4
            output/thumbnail.jpg
            output/upload_info.txt
            output/README.txt
