name: Build AI Video

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # GET READY CONTENT FROM GOOGLE SHEET
      # ==================================================

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data["content"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", data["content"].get("TOPIC"))
          print("Score:", data["content"].get("SCORE"))
          PY


      # ==================================================
      # INSTALL IMAGE GENERATION LIBRARIES
      # ==================================================

      - name: Install image tools
        run: |
          python3 -m pip install --upgrade pip
          pip install huggingface_hub pillow


      # ==================================================
      # TRY NEW AI IMAGES
      #
      # IF HUGGING FACE FAILS:
      # USE EXISTING IMAGES FROM /images/
      # ==================================================

      - name: Generate new images with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import shutil

          from PIL import Image
          from huggingface_hub import InferenceClient

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("images", exist_ok=True)

          style = """
          Photorealistic cinematic photograph,
          captured with a professional digital cinema camera,
          realistic natural lighting,
          realistic textures and materials,
          realistic depth of field,
          realistic lens characteristics,
          subtle cinematic film grain,
          highly detailed real-world photography,
          vertical 9:16 composition.

          No illustration,
          no cartoon,
          no anime,
          no 3D render,
          no text,
          no captions,
          no logos,
          no watermark.
          """

          hf_available = bool(os.environ.get("HF_TOKEN"))

          if hf_available:
              try:
                  client = InferenceClient(
                      api_key=os.environ["HF_TOKEN"]
                  )
                  print("Hugging Face image generation is available.")
              except Exception as e:
                  client = None
                  print("Could not initialize Hugging Face.")
                  print("Reason:", str(e))
          else:
              client = None
              print("HF_TOKEN is not available.")
              print("Using existing images.")

          for i in range(1, 6):

              output_file = f"images/scene_{i}.png"

              scene = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not scene:
                  scene = (
                      f"Cinematic realistic environment "
                      f"for scene {i}"
                  )

              new_image_created = False

              # ------------------------------------------
              # TRY NEW IMAGE
              # ------------------------------------------

              if client is not None:

                  try:

                      prompt = f"""
                      {style}

                      Visually represent this scene:

                      {scene}
                      """

                      print("")
                      print(
                          f"Trying to generate NEW image "
                          f"for scene {i}..."
                      )

                      image = client.text_to_image(
                          prompt=prompt,
                          model="black-forest-labs/FLUX.1-schnell"
                      )

                      # Validate image before replacing
                      # the existing image.
                      image.verify()

                      # Re-open because verify() closes
                      # the image internally.
                      image = client.text_to_image(
                          prompt=prompt,
                          model="black-forest-labs/FLUX.1-schnell"
                      )

                      image.save(output_file)

                      # Final validation
                      with Image.open(output_file) as check:
                          check.verify()

                      print(
                          f"NEW image created for scene {i}."
                      )

                      new_image_created = True

                      time.sleep(2)

                  except Exception as e:

                      print("")
                      print(
                          f"NEW image generation failed "
                          f"for scene {i}."
                      )
                      print(
                          "Reason:",
                          str(e)
                      )
                      print(
                          "Falling back to existing image..."
                      )

              # ------------------------------------------
              # FALLBACK TO EXISTING IMAGE
              # ------------------------------------------

              if not new_image_created:

                  if os.path.isfile(output_file):

                      try:

                          with Image.open(output_file) as check:
                              check.verify()

                          print(
                              f"Using existing image "
                              f"for scene {i}."
                          )

                      except Exception as e:

                          raise Exception(
                              f"Existing image for scene {i} "
                              f"is invalid: {e}"
                          )

                  else:

                      raise Exception(
                          f"No new image could be generated "
                          f"and no existing image exists for "
                          f"scene {i}."
                      )

          print("")
          print("====================================")
          print("IMAGE STAGE COMPLETED")
          print("====================================")
          print("")

          for i in range(1, 6):
              print(
                  f"images/scene_{i}.png"
              )
          PY


      # ==================================================
      # INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==================================================
      # CREATE SCENE TEXT FILES
      # ==================================================

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("scene_text", exist_ok=True)

          for i in range(1, 6):

              text = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not text:
                  text = f"Scene {i}"

              with open(
                  f"scene_text/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(text)

          print("Scene text files created.")


      # ==================================================
      # CREATE FIVE 5-SECOND VIDEO SCENES
      # TOTAL = 25 SECONDS
      # ==================================================

      - name: Create video scenes
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do

            echo "Building video scene $i..."

            ffmpeg \
              -y \
              -loop 1 \
              -i "images/scene_${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.10)':d=150:s=1080x1920:fps=30,drawtext=textfile=scene_text/scene_${i}.txt:fontcolor=white:fontsize=38:borderw=3:bordercolor=black:line_spacing=15:x=(w-text_w)/2:y=1550" \
              -t 5 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r 30 \
              "output/scenes/scene_${i}.mp4"

          done


      # ==================================================
      # JOIN FIVE SCENES
      # TOTAL = 25 SECONDS
      # ==================================================

      - name: Join scenes
        run: |
          ffmpeg \
            -y \
            -i output/scenes/scene_1.mp4 \
            -i output/scenes/scene_2.mp4 \
            -i output/scenes/scene_3.mp4 \
            -i output/scenes/scene_4.mp4 \
            -i output/scenes/scene_5.mp4 \
            -filter_complex "[0:v][1:v][2:v][3:v][4:v]concat=n=5:v=1:a=0[outv]" \
            -map "[outv]" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            output/video_without_voice.mp4


      # ==================================================
      # GENERATE AI VOICE
      #
      # IF HUGGING FACE FAILS:
      # USE FREE LOCAL VOICE
      # ==================================================

      - name: Generate voice with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python3 -m pip install --upgrade pip
          pip install huggingface_hub

          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          script = str(
              content.get("SCRIPT", "")
          ).strip()

          if not script:

              scenes = []

              for i in range(1, 6):

                  text = str(
                      content.get(f"SCENE_{i}", "")
                  ).strip()

                  if text:
                      scenes.append(text)

              script = " ".join(scenes)

          if not script:
              raise Exception(
                  "No SCRIPT or scene text found."
              )

          voice_created = False

          # ------------------------------------------
          # TRY HUGGING FACE AI VOICE
          # ------------------------------------------

          if os.environ.get("HF_TOKEN"):

              try:

                  from huggingface_hub import InferenceClient

                  print(
                      "Trying Hugging Face AI voice..."
                  )

                  client = InferenceClient(
                      api_key=os.environ["HF_TOKEN"]
                  )

                  audio = client.text_to_speech(
                      text=script,
                      model="hexgrad/Kokoro-82M"
                  )

                  Path(
                      "output/narration.flac"
                  ).write_bytes(audio)

                  print(
                      "Hugging Face AI voice created."
                  )

                  voice_created = True

              except Exception as e:

                  print(
                      "Hugging Face voice failed."
                  )
                  print(
                      "Reason:",
                      str(e)
                  )
                  print(
                      "Falling back to local voice."
                  )

          # ------------------------------------------
          # FREE LOCAL VOICE FALLBACK
          # ------------------------------------------

          if not voice_created:

              print(
                  "Installing free local speech engine..."
              )

              os.system(
                  "sudo apt-get update -qq"
              )

              os.system(
                  "sudo apt-get install -y espeak-ng"
              )

              Path(
                  "output/narration.txt"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

              result = os.system(
                  "espeak-ng "
                  "-v en-us "
                  "-s 145 "
                  "-p 45 "
                  "-a 150 "
                  "-f output/narration.txt "
                  "-w output/narration.wav"
              )

              if result != 0:
                  raise Exception(
                      "Local voice generation failed."
                  )

              print(
                  "Free local voice created."
              )

          print("")
          print("VOICE STAGE COMPLETED.")
          PY


      # ==================================================
      # ADD VOICE TO 25-SECOND VIDEO
      # ==================================================

      - name: Add voice to video
        run: |

          if [ -f output/narration.flac ]; then

            echo "Using AI voice."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.flac \
              -filter_complex "[1:a]apad[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 25 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              output/final_ai_video.mp4

          elif [ -f output/narration.wav ]; then

            echo "Using free local voice."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.wav \
              -filter_complex "[1:a]apad[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 25 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              output/final_ai_video.mp4

          else

            echo "No voice file found."
            exit 1

          fi

          echo "Final 25-second video created."


      # ==================================================
      # UPLOAD FINAL VIDEO
      # ==================================================

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-ai-video
          path: output/final_ai_video.mp4
