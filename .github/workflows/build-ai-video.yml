name: Build AI Video

on:
  workflow_dispatch:

  # Run automatically every day at 9:00 AM IST
  # 9:00 AM IST = 3:30 AM UTC
  schedule:
    - cron: "30 3 * * *"

# Required so the workflow can save duplicate-content history
# back into the repository.
permissions:
  contents: write

# Prevent two video builds from running at the same time.
concurrency:
  group: ai-video-factory
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT REPOSITORY
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. GET READY CONTENT
      # ==================================================

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("success"):
              raise Exception(
                  data.get(
                      "error",
                      "Unknown error"
                  )
              )

          os.makedirs(
              "content",
              exist_ok=True
          )

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data["content"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("READY content received.")

          print(
              "Topic:",
              data["content"].get(
                  "TOPIC",
                  ""
              )
          )

          print(
              "Title:",
              data["content"].get(
                  "TITLE",
                  ""
              )
          )
          PY


      # ==================================================
      # 3. CHECK DUPLICATE CONTENT
      #
      # The workflow creates a fingerprint from the
      # actual content.
      #
      # If that fingerprint already exists in
      # content_history.json, the video is NOT generated.
      # ==================================================

      - name: Check duplicate content
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import os

          CONTENT_FILE = (
              "content/ready_content.json"
          )

          HISTORY_FILE = (
              "content_history.json"
          )

          with open(
              CONTENT_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          # ------------------------------------------
          # Build a stable fingerprint from the actual
          # creative content.
          # ------------------------------------------

          important_fields = {
              "TOPIC": content.get(
                  "TOPIC",
                  ""
              ),

              "TITLE": content.get(
                  "TITLE",
                  ""
              ),

              "SCRIPT": content.get(
                  "SCRIPT",
                  ""
              ),

              "SCENE_1": content.get(
                  "SCENE_1",
                  ""
              ),

              "SCENE_2": content.get(
                  "SCENE_2",
                  ""
              ),

              "SCENE_3": content.get(
                  "SCENE_3",
                  ""
              ),

              "SCENE_4": content.get(
                  "SCENE_4",
                  ""
              ),

              "SCENE_5": content.get(
                  "SCENE_5",
                  ""
              )
          }

          canonical = json.dumps(
              important_fields,
              ensure_ascii=False,
              sort_keys=True
          )

          fingerprint = hashlib.sha256(
              canonical.encode("utf-8")
          ).hexdigest()

          print("")
          print(
              "Content fingerprint:"
          )
          print(fingerprint)

          # ------------------------------------------
          # Load history
          # ------------------------------------------

          if os.path.exists(HISTORY_FILE):

              with open(
                  HISTORY_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  try:
                      history = json.load(f)

                  except json.JSONDecodeError:

                      history = []

          else:

              history = []

          if not isinstance(
              history,
              list
          ):

              history = []

          # ------------------------------------------
          # DUPLICATE CHECK
          # ------------------------------------------

          if fingerprint in history:

              print("")
              print(
                  "======================================"
              )
              print(
                  "DUPLICATE CONTENT DETECTED"
              )
              print(
                  "======================================"
              )

              print(
                  "This content has already been "
                  "processed."
              )

              print(
                  "The workflow will stop instead "
                  "of creating the same video again."
              )

              raise SystemExit(1)

          # ------------------------------------------
          # Save fingerprint temporarily.
          #
          # It will only be permanently added to
          # history AFTER the video succeeds.
          # ------------------------------------------

          os.makedirs(
              "content",
              exist_ok=True
          )

          with open(
              "content/current_fingerprint.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(fingerprint)

          print("")
          print(
              "NEW content confirmed."
          )

          print(
              "Video generation can continue."
          )
          PY


      # ==================================================
      # 4. INSTALL PYTHON TOOLS
      # ==================================================

      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          pip install huggingface_hub pillow


      # ==================================================
      # 5. GENERATE IMAGES WITH FALLBACK
      #
      # Try new image first.
      #
      # If Hugging Face fails:
      # use existing scene image.
      # ==================================================

      - name: Generate new images with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import shutil
          from pathlib import Path

          from PIL import Image
          from huggingface_hub import InferenceClient

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs(
              "images",
              exist_ok=True
          )

          client = None

          if os.environ.get(
              "HF_TOKEN"
          ):

              try:

                  client = InferenceClient(
                      api_key=os.environ[
                          "HF_TOKEN"
                      ]
                  )

                  print(
                      "Hugging Face image generation "
                      "is available."
                  )

              except Exception as e:

                  print(
                      "Could not initialize "
                      "Hugging Face."
                  )

                  print(
                      "Reason:",
                      str(e)
                  )

          else:

              print(
                  "HF_TOKEN is not available."
              )

              print(
                  "Existing images will be used."
              )

          style = """
          Photorealistic cinematic photograph,
          captured with a professional digital cinema camera,
          realistic natural lighting,
          realistic textures and materials,
          realistic depth of field,
          realistic lens characteristics,
          subtle cinematic film grain,
          highly detailed real-world photography,
          vertical 9:16 composition.

          No illustration,
          no cartoon,
          no anime,
          no 3D render,
          no text,
          no captions,
          no logos,
          no watermark.
          """

          for i in range(1, 6):

              final_file = Path(
                  f"images/scene_{i}.png"
              )

              old_file = Path(
                  f"scene_{i}.png"
              )

              temp_file = Path(
                  f"images/scene_{i}_new.png"
              )

              existing_is_valid = False

              # ------------------------------------------
              # CHECK EXISTING IMAGE
              # ------------------------------------------

              if old_file.exists():

                  try:

                      with Image.open(
                          old_file
                      ) as check:

                          check.verify()

                      existing_is_valid = True

                      print(
                          f"Existing image found "
                          f"for scene {i}."
                      )

                  except Exception as e:

                      print(
                          f"Existing image for scene "
                          f"{i} is invalid."
                      )

                      print(
                          "Reason:",
                          str(e)
                      )

              # ------------------------------------------
              # TRY NEW IMAGE
              # ------------------------------------------

              new_image_created = False

              if client is not None:

                  scene = str(
                      content.get(
                          f"SCENE_{i}",
                          ""
                      )
                  ).strip()

                  if not scene:

                      scene = (
                          f"Cinematic realistic "
                          f"environment for scene {i}"
                      )

                  prompt = f"""
                  {style}

                  Visually represent this scene:

                  {scene}
                  """

                  print("")
                  print(
                      f"Trying NEW image for "
                      f"scene {i}..."
                  )

                  try:

                      image = client.text_to_image(
                          prompt=prompt,
                          model=(
                              "black-forest-labs/"
                              "FLUX.1-schnell"
                          )
                      )

                      image.save(
                          temp_file
                      )

                      with Image.open(
                          temp_file
                      ) as check:

                          check.verify()

                      shutil.move(
                          temp_file,
                          final_file
                      )

                      new_image_created = True

                      print(
                          f"NEW image created "
                          f"for scene {i}."
                      )

                      time.sleep(2)

                  except Exception as e:

                      print(
                          f"NEW image generation "
                          f"failed for scene {i}."
                      )

                      print(
                          "Reason:",
                          str(e)
                      )

                      if temp_file.exists():
                          temp_file.unlink()

              # ------------------------------------------
              # FALLBACK
              # ------------------------------------------

              if not new_image_created:

                  if existing_is_valid:

                      shutil.copy2(
                          old_file,
                          final_file
                      )

                      print(
                          f"FALLBACK: using existing "
                          f"image for scene {i}."
                      )

                  else:

                      raise Exception(
                          f"No usable image exists "
                          f"for scene {i}."
                      )

              # ------------------------------------------
              # FINAL CHECK
              # ------------------------------------------

              if not final_file.exists():

                  raise Exception(
                      f"Scene {i} image is missing."
                  )

              print(
                  f"Scene {i} image is ready."
              )

          print("")
          print(
              "All five scene images are ready."
          )
          PY


      # ==================================================
      # 6. INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==================================================
      # 7. CREATE CAPTIONS
      # ==================================================

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs(
              "scene_text",
              exist_ok=True
          )

          for i in range(1, 6):

              text = str(
                  content.get(
                      f"SCENE_{i}",
                      ""
                  )
              ).strip()

              if not text:

                  text = (
                      f"Scene {i}"
                  )

              wrapped_lines = []

              for paragraph in text.splitlines():

                  lines = textwrap.wrap(
                      paragraph,
                      width=28,
                      break_long_words=False,
                      break_on_hyphens=False
                  )

                  if lines:

                      wrapped_lines.extend(
                          lines
                      )

                  else:

                      wrapped_lines.append(
                          ""
                      )

              with open(
                  f"scene_text/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "\n".join(
                          wrapped_lines
                      )
                  )

              print(
                  f"Caption created for scene {i}."
              )

          print(
              "All caption files created."
          )
          PY


      # ==================================================
      # 8. CREATE FIVE VIDEO SCENES
      #
      # 248 frames / 30fps
      # ≈ 8.27 seconds each
      #
      # After transitions:
      # ≈ 40 seconds total
      # ==================================================

      - name: Create video scenes
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do

            echo ""
            echo "======================================"
            echo "Building video scene $i"
            echo "======================================"

            ffmpeg \
              -y \
              -loop 1 \
              -i "images/scene_${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.10)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=248:s=1080x1920:fps=30,drawtext=textfile=scene_text/scene_${i}.txt:fontcolor=white:fontsize=32:borderw=3:bordercolor=black:line_spacing=10:x=(w-text_w)/2:y=h-text_h-180" \
              -frames:v 248 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r 30 \
              -movflags +faststart \
              "output/scenes/scene_${i}.mp4"

          done

          echo ""
          echo "All five video scenes created."


      # ==================================================
      # 9. JOIN SCENES WITH TRANSITIONS
      # ==================================================

      - name: Join scenes with transitions
        run: |

          ffmpeg \
            -y \
            -i output/scenes/scene_1.mp4 \
            -i output/scenes/scene_2.mp4 \
            -i output/scenes/scene_3.mp4 \
            -i output/scenes/scene_4.mp4 \
            -i output/scenes/scene_5.mp4 \
            -filter_complex "\
          [0:v]setpts=PTS-STARTPTS[v0];\
          [1:v]setpts=PTS-STARTPTS[v1];\
          [2:v]setpts=PTS-STARTPTS[v2];\
          [3:v]setpts=PTS-STARTPTS[v3];\
          [4:v]setpts=PTS-STARTPTS[v4];\
          [v0][v1]xfade=transition=fade:duration=0.3:offset=7.966[v01];\
          [v01][v2]xfade=transition=fade:duration=0.3:offset=15.932[v012];\
          [v012][v3]xfade=transition=fade:duration=0.3:offset=23.898[v0123];\
          [v0123][v4]xfade=transition=fade:duration=0.3:offset=31.864[outv]" \
            -map "[outv]" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -movflags +faststart \
            output/video_without_voice.mp4

          echo ""
          echo "Video scenes joined successfully."


      # ==================================================
      # 10. GENERATE VOICE
      #
      # AI voice first.
      # Free local voice fallback.
      # ==================================================

      - name: Generate voice with fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |

          python3 - <<'PY'
          import os
          import json
          import subprocess
          from pathlib import Path

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          script = str(
              content.get(
                  "SCRIPT",
                  ""
              )
          ).strip()

          if not script:

              scenes = []

              for i in range(1, 6):

                  text = str(
                      content.get(
                          f"SCENE_{i}",
                          ""
                      )
                  ).strip()

                  if text:

                      scenes.append(
                          text
                      )

              script = " ".join(
                  scenes
              )

          if not script:

              raise Exception(
                  "No narration script found."
              )

          voice_created = False

          # ------------------------------------------
          # TRY AI VOICE
          # ------------------------------------------

          if os.environ.get(
              "HF_TOKEN"
          ):

              try:

                  from huggingface_hub import (
                      InferenceClient
                  )

                  print(
                      "Trying AI voice..."
                  )

                  client = InferenceClient(
                      api_key=os.environ[
                          "HF_TOKEN"
                      ]
                  )

                  audio = client.text_to_speech(
                      text=script,
                      model="hexgrad/Kokoro-82M"
                  )

                  Path(
                      "output/narration.flac"
                  ).write_bytes(
                      audio
                  )

                  print(
                      "AI voice created."
                  )

                  voice_created = True

              except Exception as e:

                  print(
                      "AI voice unavailable."
                  )

                  print(
                      "Reason:",
                      str(e)
                  )

          # ------------------------------------------
          # LOCAL FALLBACK
          # ------------------------------------------

          if not voice_created:

              print(
                  "Using free local voice."
              )

              subprocess.run(
                  [
                      "sudo",
                      "apt-get",
                      "update",
                      "-qq"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "sudo",
                      "apt-get",
                      "install",
                      "-y",
                      "espeak-ng"
                  ],
                  check=True
              )

              Path(
                  "output/narration.txt"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "espeak-ng",
                      "-v",
                      "en-us",
                      "-s",
                      "145",
                      "-p",
                      "45",
                      "-a",
                      "150",
                      "-f",
                      "output/narration.txt",
                      "-w",
                      "output/narration.wav"
                  ],
                  check=True
              )

              print(
                  "Free local voice created."
              )
          PY


      # ==================================================
      # 11. CREATE BACKGROUND MUSIC
      # ==================================================

      - name: Create background music
        run: |
          python3 - <<'PY'
          import math
          import wave
          import struct

          sample_rate = 44100
          duration = 40

          chords = [
              [110.00, 164.81, 220.00],
              [98.00, 146.83, 196.00],
              [130.81, 196.00, 261.63],
              [87.31, 130.81, 174.61],
              [110.00, 164.81, 220.00]
          ]

          total_samples = int(
              sample_rate * duration
          )

          with wave.open(
              "output/background_music.wav",
              "w"
          ) as wav:

              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)

              for n in range(
                  total_samples
              ):

                  t = (
                      n / sample_rate
                  )

                  section = min(
                      int(t / 8),
                      4
                  )

                  chord = chords[
                      section
                  ]

                  value = 0.0

                  for index, freq in enumerate(
                      chord
                  ):

                      value += (
                          math.sin(
                              2
                              * math.pi
                              * freq
                              * t
                          )
                          * (
                              0.16
                              - index * 0.025
                          )
                      )

                  movement = (
                      0.65
                      + 0.35
                      * math.sin(
                          2
                          * math.pi
                          * 0.08
                          * t
                      )
                  )

                  fade_in = min(
                      t / 2.0,
                      1.0
                  )

                  fade_out = min(
                      (duration - t) / 2.0,
                      1.0
                  )

                  envelope = max(
                      0.0,
                      min(
                          fade_in,
                          fade_out
                      )
                  )

                  value *= (
                      movement
                      * envelope
                      * 0.35
                  )

                  value = max(
                      -1.0,
                      min(
                          1.0,
                          value
                      )
                  )

                  sample = int(
                      value * 32767
                  )

                  wav.writeframes(
                      struct.pack(
                          "<hh",
                          sample,
                          sample
                      )
                  )

          print(
              "40-second background music created."
          )
          PY


      # ==================================================
      # 12. MIX VOICE + MUSIC
      # ==================================================

      - name: Mix voice and background music
        run: |

          if [ -f output/narration.flac ]; then

            echo "Using AI narration."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.flac \
              -i output/background_music.wav \
              -filter_complex "\
          [1:a]apad,volume=1.0[voice];\
          [2:a]volume=0.12[music];\
          [voice][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 40 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              output/final_ai_video.mp4

          elif [ -f output/narration.wav ]; then

            echo "Using local narration."

            ffmpeg \
              -y \
              -i output/video_without_voice.mp4 \
              -i output/narration.wav \
              -i output/background_music.wav \
              -filter_complex "\
          [1:a]apad,volume=1.0[voice];\
          [2:a]volume=0.12[music];\
          [voice][music]amix=inputs=2:duration=first:dropout_transition=2[audio]" \
              -map 0:v \
              -map "[audio]" \
              -t 40 \
              -c:v copy \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              output/final_ai_video.mp4

          else

            echo "No narration was created."

            exit 1

          fi

          echo ""
          echo "Final approximately 40-second video created."


      # ==================================================
      # 13. CREATE THUMBNAIL
      # ==================================================

      - name: Create thumbnail
        run: |

          echo "Creating thumbnail..."

          ffmpeg \
            -y \
            -i images/scene_1.png \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" \
            -frames:v 1 \
            -q:v 2 \
            output/thumbnail.jpg

          echo "Thumbnail created."


      # ==================================================
      # 14. CREATE YOUTUBE UPLOAD INFORMATION
      # ==================================================

      - name: Create upload information
        run: |
          python3 - <<'PY'
          import json
          import re

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          topic = str(
              content.get(
                  "TOPIC",
                  "AI Short"
              )
          ).strip()

          title = str(
              content.get(
                  "TITLE",
                  ""
              )
          ).strip()

          description = str(
              content.get(
                  "DESCRIPTION",
                  ""
              )
          ).strip()

          hashtags = str(
              content.get(
                  "HASHTAGS",
                  ""
              )
          ).strip()

          if not title:

              title = topic

          title = re.sub(
              r"\s+",
              " ",
              title
          ).strip()

          if len(title) > 95:

              title = (
                  title[:92].rstrip()
                  + "..."
              )

          if not description:

              description = (
                  f"{topic}\n\n"
                  "Watch till the end and "
                  "share your thoughts."
              )

          if not hashtags:

              words = re.findall(
                  r"[A-Za-z0-9]+",
                  topic
              )

              tags = [
                  "#Shorts"
              ]

              for word in words[:4]:

                  if len(word) >= 3:

                      tag = (
                          "#"
                          + word.lower()
                      )

                      if tag not in tags:

                          tags.append(
                              tag
                          )

              hashtags = " ".join(
                  tags
              )

          if "#Shorts" not in description:

              description = (
                  description.rstrip()
                  + "\n\n"
                  + hashtags
              )

          with open(
              "output/upload_info.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "YOUTUBE UPLOAD INFORMATION\n"
              )

              f.write(
                  "===========================\n\n"
              )

              f.write(
                  "TITLE:\n"
              )

              f.write(
                  title
                  + "\n\n"
              )

              f.write(
                  "DESCRIPTION:\n"
              )

              f.write(
                  description
                  + "\n\n"
              )

              f.write(
                  "HASHTAGS:\n"
              )

              f.write(
                  hashtags
                  + "\n\n"
              )

              f.write(
                  "VIDEO:\n"
              )

              f.write(
                  "final_ai_video.mp4\n\n"
              )

              f.write(
                  "THUMBNAIL:\n"
              )

              f.write(
                  "thumbnail.jpg\n"
              )

          print("")
          print("TITLE:")
          print(title)

          print("")
          print("HASHTAGS:")
          print(hashtags)

          print("")
          print(
              "Upload information created."
          )
          PY


      # ==================================================
      # 15. CREATE README
      # ==================================================

      - name: Create package README
        run: |

          cat > output/README.txt <<'EOF'
          AI VIDEO PACKAGE
          ==============================

          This package contains the completed
          approximately 40-second AI video.

          FILES
          ------------------------------

          final_ai_video.mp4
          The finished video with:
          - 5 cinematic scenes
          - animated camera movement
          - captions
          - voice narration
          - background music
          - smooth transitions

          thumbnail.jpg
          YouTube thumbnail.

          upload_info.txt
          Suggested YouTube title,
          description and hashtags.

          package_info.txt
          Information about this build.

          Generated automatically by
          AI Content Video Factory.
          EOF

          echo "README created."


      # ==================================================
      # 16. CREATE DATED PACKAGE
      # ==================================================

      - name: Organize dated video package
        run: |

          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H-%M-%S")

          PACKAGE_NAME="AI_VIDEO_${DATE}_${TIME}"

          echo ""
          echo "======================================"
          echo "Creating package:"
          echo "$PACKAGE_NAME"
          echo "======================================"

          mkdir -p \
            "output/$PACKAGE_NAME"

          cp \
            output/final_ai_video.mp4 \
            "output/$PACKAGE_NAME/final_ai_video.mp4"

          cp \
            output/thumbnail.jpg \
            "output/$PACKAGE_NAME/thumbnail.jpg"

          cp \
            output/upload_info.txt \
            "output/$PACKAGE_NAME/upload_info.txt"

          cp \
            output/README.txt \
            "output/$PACKAGE_NAME/README.txt"

          FINGERPRINT=$(cat \
            content/current_fingerprint.txt)

          cat > \
            "output/$PACKAGE_NAME/package_info.txt" \
            <<EOF
          AI VIDEO PACKAGE
          ==============================

          Package:
          $PACKAGE_NAME

          GitHub Run:
          ${{ github.run_number }}

          Repository:
          ${{ github.repository }}

          Created:
          $DATE $TIME

          Content fingerprint:
          $FINGERPRINT

          Video:
          final_ai_video.mp4

          Thumbnail:
          thumbnail.jpg

          Upload information:
          upload_info.txt

          This package was automatically
          created by the AI Video Factory.
          EOF

          echo "$PACKAGE_NAME" \
            > output/package_name.txt

          echo ""
          echo "Package successfully organized."

          echo ""
          echo "Contents:"

          ls -lh \
            "output/$PACKAGE_NAME"


      # ==================================================
      # 17. SAVE CONTENT TO HISTORY
      #
      # This happens ONLY after the video has been
      # successfully generated.
      # ==================================================

      - name: Save processed content history
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          HISTORY_FILE = (
              "content_history.json"
          )

          fingerprint_file = (
              "content/current_fingerprint.txt"
          )

          if not os.path.exists(
              fingerprint_file
          ):

              raise Exception(
                  "Fingerprint file missing."
              )

          fingerprint = open(
              fingerprint_file,
              "r",
              encoding="utf-8"
          ).read().strip()

          if os.path.exists(
              HISTORY_FILE
          ):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []

          if not isinstance(
              history,
              list
          ):

              history = []

          # Do not add the same fingerprint twice.
          if fingerprint not in history:

              history.append(
                  fingerprint
              )

          # Keep the file manageable.
          # The newest 500 processed contents
          # are retained.
          history = history[-500:]

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2
              )

          # Create a human-readable log as well.
          os.makedirs(
              "content",
              exist_ok=True
          )

          log_file = (
              "content/processing_log.json"
          )

          if os.path.exists(
              log_file
          ):

              try:

                  with open(
                      log_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      log = json.load(f)

              except Exception:

                  log = []

          else:

              log = []

          if not isinstance(
              log,
              list
          ):

              log = []

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:

              content = json.load(f)

          log.append(
              {
                  "fingerprint": fingerprint,
                  "topic": content.get(
                      "TOPIC",
                      ""
                  ),
                  "title": content.get(
                      "TITLE",
                      ""
                  ),
                  "created_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "github_run": "${{ github.run_number }}"
              }
          )

          log = log[-500:]

          with open(
              log_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  log,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "Processed content saved."
          )

          print(
              "History entries:",
              len(history)
          )
          PY


      # ==================================================
      # 18. COMMIT CONTENT HISTORY TO GITHUB
      # ==================================================

      - name: Commit content history
        run: |

          git config user.name \
            "AI Video Factory"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            content_history.json \
            content/processing_log.json

          if git diff --cached --quiet; then

            echo "No history changes to commit."

          else

            git commit \
              -m "Update AI video content history"

            git push \
              origin \
              HEAD:${{ github.ref_name }}

            echo ""
            echo "Content history committed successfully."

          fi


      # ==================================================
      # 19. UPLOAD FINAL ORGANIZED PACKAGE
      # ==================================================

      - name: Upload organized video package
        uses: actions/upload-artifact@v4

        with:
          name: AI-VIDEO-Run-${{ github.run_number }}

          path: |
            output/AI_VIDEO_*/

          retention-days: 30
