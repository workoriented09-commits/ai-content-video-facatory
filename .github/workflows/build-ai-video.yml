name: Build AI Video

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # GET READY CONTENT FROM GOOGLE SHEET
      # --------------------------------------------------

      - name: Get READY content
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          FACTORY_SECRET: ${{ secrets.FACTORY_SECRET }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          secret = os.environ["FACTORY_SECRET"]

          payload = json.dumps({
              "secret": secret
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Getting READY content...")

          with urllib.request.urlopen(request) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("success"):
              raise Exception(
                  data.get("error", "Unknown error")
              )

          os.makedirs("content", exist_ok=True)

          with open(
              "content/ready_content.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data["content"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("READY content received.")
          print("Topic:", data["content"].get("TOPIC"))
          print("Score:", data["content"].get("SCORE"))
          PY


      # --------------------------------------------------
      # GENERATE FIVE AI IMAGES
      # --------------------------------------------------

      - name: Generate five AI images
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python3 -m pip install --upgrade pip
          pip install huggingface_hub pillow

          python3 - <<'PY'
          import os
          import json
          import time

          from huggingface_hub import InferenceClient

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("images", exist_ok=True)

          client = InferenceClient(
              api_key=os.environ["HF_TOKEN"]
          )

          style = """
          Photorealistic cinematic photograph,
          captured with a professional digital cinema camera,
          realistic natural lighting,
          realistic textures and materials,
          realistic depth of field,
          realistic lens characteristics,
          subtle cinematic film grain,
          highly detailed real-world photography,
          vertical 9:16 composition.

          No illustration, no cartoon, no anime,
          no 3D render, no text, no captions,
          no logos, no watermark.
          """

          for i in range(1, 6):

              scene = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not scene:
                  scene = (
                      f"Cinematic realistic environment "
                      f"for scene {i}"
                  )

              prompt = f"""
              {style}

              Visually represent this scene:

              {scene}
              """

              print(
                  f"Generating AI image for scene {i}..."
              )

              image = client.text_to_image(
                  prompt=prompt,
                  model="black-forest-labs/FLUX.1-schnell"
              )

              image.save(
                  f"images/scene_{i}.png"
              )

              print(
                  f"Scene {i} image saved."
              )

              time.sleep(2)


      # --------------------------------------------------
      # INSTALL FFMPEG
      # --------------------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # --------------------------------------------------
      # CREATE SCENE TEXT FILES
      # --------------------------------------------------

      - name: Create scene text files
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          os.makedirs("scene_text", exist_ok=True)

          for i in range(1, 6):

              text = str(
                  content.get(f"SCENE_{i}", "")
              ).strip()

              if not text:
                  text = f"Scene {i}"

              with open(
                  f"scene_text/scene_{i}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(text)

          print("Scene text files created.")


      # --------------------------------------------------
      # CREATE FIVE ANIMATED VIDEO SCENES
      # --------------------------------------------------

      - name: Create video scenes
        run: |
          mkdir -p output/scenes

          for i in 1 2 3 4 5
          do

            echo "Building video scene $i..."

            ffmpeg \
              -y \
              -loop 1 \
              -i "images/scene_${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0008,1.08)':d=90:s=1080x1920:fps=30,drawtext=textfile=scene_text/scene_${i}.txt:fontcolor=white:fontsize=38:borderw=3:bordercolor=black:line_spacing=15:x=(w-text_w)/2:y=1550" \
              -t 3 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r 30 \
              "output/scenes/scene_${i}.mp4"

          done


      # --------------------------------------------------
      # JOIN FIVE SCENES
      # --------------------------------------------------

      - name: Join scenes
        run: |
          ffmpeg \
            -y \
            -i output/scenes/scene_1.mp4 \
            -i output/scenes/scene_2.mp4 \
            -i output/scenes/scene_3.mp4 \
            -i output/scenes/scene_4.mp4 \
            -i output/scenes/scene_5.mp4 \
            -filter_complex "[0:v][1:v][2:v][3:v][4:v]concat=n=5:v=1:a=0[outv]" \
            -map "[outv]" \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            output/video_without_voice.mp4


      # --------------------------------------------------
      # GENERATE AI VOICE
      # --------------------------------------------------

      - name: Generate AI voice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          from huggingface_hub import InferenceClient

          with open(
              "content/ready_content.json",
              "r",
              encoding="utf-8"
          ) as f:
              content = json.load(f)

          # Use SCRIPT if available.
          # Otherwise combine the five scene texts.

          script = str(
              content.get("SCRIPT", "")
          ).strip()

          if not script:
              scenes = []

              for i in range(1, 6):
                  text = str(
                      content.get(f"SCENE_{i}", "")
                  ).strip()

                  if text:
                      scenes.append(text)

              script = " ".join(scenes)

          if not script:
              raise Exception(
                  "No SCRIPT or scene text found for voice narration."
              )

          print("Generating AI voice...")
          print("Narration text:")
          print(script)

          client = InferenceClient(
              api_key=os.environ["HF_TOKEN"]
          )

          audio = client.text_to_speech(
              text=script,
              model="hexgrad/Kokoro-82M"
          )

          Path(
              "output/narration.flac"
          ).write_bytes(audio)

          print("AI voice generated successfully.")
          PY


      # --------------------------------------------------
      # ADD VOICE TO FINAL VIDEO
      # --------------------------------------------------

      - name: Add AI voice to video
        run: |

          ffmpeg \
            -y \
            -i output/video_without_voice.mp4 \
            -i output/narration.flac \
            -filter_complex "[1:a]apad[audio]" \
            -map 0:v \
            -map "[audio]" \
            -t 15 \
            -c:v copy \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/final_ai_video.mp4

          echo "Final video with AI voice created."


      # --------------------------------------------------
      # UPLOAD FINAL VIDEO
      # --------------------------------------------------

      - name: Upload final video
        uses: actions/upload-artifact@v4

        with:
          name: final-ai-video
          path: output/final_ai_video.mp4
